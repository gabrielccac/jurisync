# Cinthia's portal access. Method and secret names only; the values go in the gitignored customers/cinthia/.env.
# Every PJe uses her PDPJ account (CPF, password, PDPJ authenticator); each Eproc uses UF + OAB, the same password and
# that court's authenticator profile (from her Google Authenticator export).

[trf1-1g]
method = "password_totp"
secrets = ["PJE_1G_USERNAME", "PJE_1G_PASSWORD", "PJE_1G_2FA_DATA"]

[trf5-1g]
method = "password_totp"
secrets = ["PJE_TRF5_1G_USERNAME", "PJE_TRF5_1G_PASSWORD", "PJE_TRF5_1G_2FA_DATA"]

[trf3-1g]
method = "password_totp"
secrets = ["PJE_TRF3_1G_USERNAME", "PJE_TRF3_1G_PASSWORD", "PJE_TRF3_1G_2FA_DATA"]

[trf6-1g]
method = "browser_totp"
secrets = ["TRF6_USERNAME", "TRF6_PASSWORD", "TRF6_2FA_DATA"]

[trf6-2g]
method = "browser_totp"
secrets = ["TRF6_USERNAME", "TRF6_PASSWORD", "TRF6_2FA_DATA"]

[tjmg-1g]
method = "browser_totp"
secrets = ["TJMG_1G_USERNAME", "TJMG_1G_PASSWORD", "TJMG_1G_2FA_DATA"]

# PJe login with her A3 token (PJE_AUTH=a3 for every PJe portal); the PIN unlocks the token. The token and its
# PKCS#11 driver must be on the machine where the servers run. Eproc keeps the password login.
[env]
secrets = ["PJE_AUTH", "PJE_A3_PIN", "ADVBOX_EMAIL", "ADVBOX_PASSWORD", "ADVBOX_DEVICE_ID"]

# A3 (12/11): PJE_AUTH=a3 / EPROC_AUTH=a3 no .env; PIN do token em PJE_A3_PIN. TOTP do PDPJ igual ao do TRF1.
[tjpe-1g]
method = "certificate_totp"
secrets = ["PJE_A3_PIN", "TJPE_1G_2FA_DATA"]

[tjba-1g]
method = "certificate_totp"
secrets = ["PJE_A3_PIN", "TJBA_1G_2FA_DATA"]

# eSAJ TJSP com A3: suporte a conferir no conector eSAJ.
[tjsp-esaj]
method = "certificate_totp"
secrets = ["PJE_A3_PIN"]
