[env]
# The TJES 1G AWS WAF CAPTCHA is solved by a vision model on OpenRouter (core/awswaf.py).
optional = ["OPENROUTER_API_KEY"]
secrets = ["EASYJUR_EMAIL", "EASYJUR_PASSWORD", "CHATGURU_EMAIL", "CHATGURU_PASSWORD"]
# Pinned values: A1 opt-ins and the OAB profile picked where the portal lists several.
set = { TRF2_1G_RJ_CERT = "true", TRF2_1G_ES_CERT = "true", TRF2_2G_CERT = "true", TRF4_1G_RS_CERT = "true", TRF4_1G_SC_CERT = "true", TRF4_1G_PR_CERT = "true", TRF4_2G_CERT = "true", TJPR_2G_CERT = "true", TJAC_1G_CERT = "true", TJAC_2G_CERT = "true", TJAP_1G_CERT = "true", TJPR_2G_USER_PROFILE = "GO022729", TJPR_1G_CERT = "true", TJPR_1G_USER_PROFILE = "GO022729", TJSP_1G_CERT = "true", TJSP_2G_CERT = "true", TJSP_1G_USER_PROFILE = "SP527617", TJSP_2G_USER_PROFILE = "SP527617", TJGO_1G_USER_PROFILE = "GO22729" , TNU_CERT = "true", PJE_1G_CERT = "true", PJE_2G_CERT = "true", PJE_TRF3_1G_CERT = "true", PJE_TRF3_2G_CERT = "true", TJPE_1G_CERT = "true", TJSC_1G_CERT = "true", TJSC_2G_CERT = "true", TJRJ_1G_CERT = "true", TJRS_1G_CERT = "true", TJMG_1G_CERT = "true", TJSC_1G_USER_PROFILE = "GO022729", TJSC_2G_USER_PROFILE = "GO022729" }

