# Juliana Mendes Dias (OAB/MG 144366, também OAB/SP 552800). Method and secret names only; values in the gitignored .env.
# A1 e-CPF (válido até 09/07/2027) + exportação do Google Authenticator em 2 QR (QR_Juliana_1/2.png): contas
# Eproc (TRF6, TJRS, TJSC, TJAC, TJSP, TJSE, TJRJ, TJMG, TJPR x2, TJMS, TJAL, TJTO), Projudi, Projudi TJRR e PDPJ.
# Portais escolhidos pelas publicações do DJEN (set–nov/2026, 781 comunicações) e pelas contas do autenticador.
# Cada <PREFIX>_2FA_DATA guarda só a conta daquele tribunal (otpauth://totp), escolhida pelo emissor da exportação.

# Eproc: A1 + autenticador do tribunal (<PREFIX>_CERT em [env].set).
