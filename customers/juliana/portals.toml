# Fora após a validação de 23/11: Eproc TJRS (A1 recusado: conferir cadastro/vínculo do certificado ou mandar
# usuário e senha) e TJPR 1G/2G (código da 1ª conta "Eproc/TJPR" recusado: dizer qual conta é de cada grau).
# Pendentes (fora até chegar a senha): Eproc TRF6 e TJTO (login com usuário e senha + autenticador), Projudi TJPR e
# TJRR (CPF e senha + autenticador). Sem conector: Eproc TJAL e TJSE, Projudi TJBA.

[env]
set = { TJMG_1G_CERT = "true", TJMG_2G_CERT = "true", TJSP_1G_CERT = "true", TJSP_2G_CERT = "true", TJSC_1G_CERT = "true", TJSC_2G_CERT = "true", TJRJ_1G_CERT = "true", TJRJ_2G_CERT = "true", TJMS_1G_CERT = "true", TJAC_1G_CERT = "true", TJAC_2G_CERT = "true", TJMG_PJE_1G_CERT = "true", TJMG_PJE_TR_CERT = "true", TJAP_1G_CERT = "true", TJPE_1G_CERT = "true", PJE_TRF3_1G_CERT = "true", TJSP_1G_USER_PROFILE = "MG144366", TJSP_2G_USER_PROFILE = "MG144366", TJGO_1G_USER_PROFILE = "MG144366" }
