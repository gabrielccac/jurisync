# Kirlia Mara: portais do DADOS AUTOMAÇÃO.docx (28/10). Valores no .env (gitignored).

[trf1-1g]
method = "password_totp"
secrets = ["PJE_1G_USERNAME", "PJE_1G_PASSWORD", "PJE_1G_2FA_DATA"]

[trf3-1g]
method = "password_totp"
secrets = ["PJE_TRF3_1G_USERNAME", "PJE_TRF3_1G_PASSWORD", "PJE_TRF3_1G_2FA_DATA"]

[trf2-1g-rj]
method = "browser_totp"
secrets = ["TRF2_1G_RJ_USERNAME", "TRF2_1G_RJ_PASSWORD", "TRF2_1G_RJ_2FA_DATA"]

# e-SAJ TJSP fora: a senha entra, mas o portal manda um código ao e-mail a cada login, e o conector não o lê (reteste de
# 25/11). Com um A1: [tjsp-esaj] method = "certificate_challenge", secrets ESAJ_A1_P12|PJE_A1_P12 e o PIN.

[tjsp-1g]
method = "browser_totp"
secrets = ["TJSP_1G_USERNAME", "TJSP_1G_PASSWORD", "TJSP_1G_2FA_DATA"]

[env]
secrets = ["ADVBOX_EMAIL", "ADVBOX_PASSWORD", "ZAPSIGN_EMAIL", "ZAPSIGN_PASSWORD"]
