# Jean's portal access. Method and secret names only; the values go in the gitignored
# customers/jean/.env (or the shared repository .env). "A|B" means either variable is enough.

[trf1-1g]
method = "password_totp"
secrets = ["PJE_1G_USERNAME", "PJE_1G_PASSWORD", "PJE_1G_2FA_DATA"]

[trf1-2g]
method = "password_totp"
secrets = ["PJE_2G_USERNAME", "PJE_2G_PASSWORD", "PJE_2G_2FA_DATA"]

# TJAP 1G uses the same PDPJ account, password and TOTP as the TRF1 portals above.
[tjap-1g]
method = "password_totp"
secrets = ["TJAP_1G_USERNAME", "TJAP_1G_PASSWORD", "TJAP_1G_2FA_DATA"]

# TJRS Eproc 1G: own login (AP005849) with the Eproc/TJRS authenticator.
[tjrs-1g]
method = "browser_totp"
secrets = ["TJRS_1G_USERNAME", "TJRS_1G_PASSWORD", "TJRS_1G_2FA_DATA"]

# Juridiq and INSS-GERID belong to no portal. GERID signs in with an A3 certificate (PIN typed on the
# machine) plus this authenticator secret, so it is registered but not login-tested during import.
[env]
secrets = ["JURIDIQ_EMAIL", "JURIDIQ_PASSWORD", "INSS_GERID_TOTP_SECRET|INSS_GERID_QR_IMAGE"]
optional = ["INSS_GERID_TOTP_ACCOUNT"]
